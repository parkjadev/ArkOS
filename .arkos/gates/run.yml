gate: run
question: "Can we operate this without surprise?"
criteria:
  - id: CRT-023
    description: SLOs defined
    evidence: Runbook lists at least one numeric SLO target
    automated: false
  - id: CRT-024
    description: Runbook exists and covers required sections
